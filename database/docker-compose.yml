# MySQL 8 para desenvolvimento local.
# Ligar:    npm run db:up     (ou: docker compose up -d --wait)
# Desligar: npm run db:down   (ou: docker compose stop)
# Os valores ${...} vêm do database/.env.
services:
  mysql:
    image: mysql:8
    container_name: portfolio-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: portfolio
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # utf8mb4_unicode_ci igual ao 001_schema.sql; fuso UTC (datas em UTC no banco).
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      # Só na máquina local (127.0.0.1), nunca exposto na rede.
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      # Os dados sobrevivem a "stop" e "down"; só "down -v" apaga.
      - mysql-data:/var/lib/mysql
      # Roda apenas na PRIMEIRA criação do volume.
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  mysql-data:
    name: portfolio-mysql-data
